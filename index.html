<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منهج الإنجليزي للعمل — الإصدار 18 · 15-11-2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a1120;--card:rgba(255,255,255,.045);--ink:#eef1f7;--muted:#98a3b9;--line:rgba(255,255,255,.09);
  --accent:#d9b46c;--accent-soft:rgba(217,180,108,.12);--ok:#4fd1a1;--ok-soft:rgba(79,209,161,.13);--bad:#f2867a;--bad-soft:rgba(242,134,122,.13);
  --warn:#f0c36b;--warn-soft:rgba(240,195,107,.12);--radius:18px;
  --gold:linear-gradient(135deg,#f1d592 0%,#d9b46c 45%,#a87b34 100%);
  --solid:#111a2e;--shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.55}
.en{font-family:"Inter",system-ui,sans-serif;direction:ltr;unicode-bidi:isolate;text-align:left}
header{padding:18px 16px 10px;max-width:760px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.progress{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;max-width:760px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:760px;margin:0 auto;padding:12px 12px 80px}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.tools select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.unit-head{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 10px}
.unit-head h2{font-size:1.05rem;margin:0}
.unit-head span{color:var(--muted);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.card.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.row{display:flex;align-items:center;gap:10px;padding:12px 12px;cursor:pointer}
.row .txt{flex:1;min-width:0}
.row .en{font-weight:600;font-size:1.02rem}
.row .pos{font-size:.72rem;color:var(--accent);font-weight:600;margin-bottom:1px}
.row .ar{color:var(--muted);font-size:.9rem}
.badge{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.icon-btn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-size:1.1rem;cursor:pointer;display:grid;place-items:center}
.body{display:none;padding:0 12px 14px;border-top:1px dashed var(--line)}
.card.open .body{display:block}
.ex{margin:12px 0 4px;padding:10px 12px;background:var(--bg);border-radius:10px}
.ex .lbl{font-size:.75rem;color:var(--muted)}
.tip{margin:10px 0;padding:8px 12px;background:var(--warn-soft);color:var(--ink);border-radius:10px;font-size:.88rem}
.tip b{color:var(--warn)}
.section-lbl{font-size:.8rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:10px;font:inherit;font-size:.88rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 12px;border-radius:99px;font:inherit;font-size:.82rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
textarea{width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-family:"Inter",system-ui,sans-serif;direction:ltr;text-align:left;resize:vertical}
.hint{font-size:.8rem;color:var(--muted);margin:4px 0 8px}
.result{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.result .score{font-weight:700;font-size:1.05rem;margin-bottom:6px}
.words{line-height:2.1}
.w{display:inline-block;padding:0 6px;margin:0 2px;border-radius:6px}
.w.ok{background:var(--ok-soft);color:var(--ok)}
.w.near{background:var(--warn-soft);color:var(--warn)}
.w.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.heard{font-size:.85rem;color:var(--muted);margin-top:6px}
.ai{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);white-space:pre-wrap;font-size:.92rem}
audio{width:100%;margin-top:8px}
label.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.92rem;cursor:pointer}
label.check input{width:20px;height:20px}
.plan .card{padding:14px}
.plan h3{margin:0 0 6px;font-size:1rem}
.plan ol,.plan ul{margin:6px 0;padding-inline-start:20px}
.plan p{margin:6px 0}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:1.2rem}
.stat span{font-size:.8rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.banner div{flex:1;font-size:.92rem}
.banner .btn{background:#fff;color:var(--accent);border-color:#fff;font-weight:600}
.rv-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.rv-top{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:10px}
.rv-ar{font-size:1.2rem;font-weight:600;margin:6px 0 14px}
.rv-en{font-size:1.15rem;font-weight:700;margin:10px 0}
.rv-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.rv-actions .btn{justify-content:center;padding:12px}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.again{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tab .cnt{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem;margin-inline-start:4px}
.lessons{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.lessons::-webkit-scrollbar{display:none}
.chip.lesson{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;line-height:1.3;padding:6px 12px;border-radius:12px}
.chip.lesson small{font-size:.7rem;color:var(--muted)}
.chip.lesson.full{border-color:var(--ok)}
.chip.lesson.full small{color:var(--ok)}
.chip.level{min-width:92px}
.chip.level:disabled{opacity:.45}
.levels{border-bottom:1px dashed var(--line);margin-bottom:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--card);color:var(--ink);border-radius:16px;max-width:420px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;font-size:1.1rem}
.modal p{margin:6px 0;font-size:.95rem}
.lock-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center}
.lock-card .big{font-size:2.4rem}
.req{display:flex;justify-content:space-between;font-size:.88rem;margin:6px 0}
.ep{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer}
.ep .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;flex:0 0 auto}
.ep.done .num{background:var(--ok-soft);color:var(--ok)}
.ep.locked{opacity:.55}
.ep .t{flex:1}
.ep .t small{display:block;color:var(--muted);font-size:.78rem}
.stage{background:linear-gradient(180deg,var(--accent-soft),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.stage .scene{font-size:.82rem;color:var(--muted);text-align:center;margin-bottom:10px}
.people{display:flex;justify-content:space-around}
.person{text-align:center;transition:transform .2s}
.person .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:var(--card);border:3px solid var(--line);margin:0 auto 4px;transition:border-color .2s,box-shadow .2s}
.person.talk{transform:scale(1.08)}
.person.talk .av{border-color:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
.person .nm{font-size:.82rem;font-weight:600}
.subtitle{min-height:3.2em;text-align:center;margin-top:12px;font-weight:600}
.subtitle .ar{display:block;font-weight:400;color:var(--muted);font-size:.88rem}
.lines .ln{display:flex;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;margin-bottom:4px;background:var(--card);border:1px solid var(--line)}
.lines .ln.cur{border-color:var(--accent);background:var(--accent-soft)}
.lines .sp{font-size:.75rem;font-weight:700;color:var(--accent);min-width:56px}
.lines .ln .ar{display:block;color:var(--muted);font-size:.85rem}
.hidden-txt{letter-spacing:3px;color:var(--muted)}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px}
.qbox .qq{font-weight:600;margin:10px 0 6px}
.qbox label{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.qbox label.right{background:var(--ok-soft);border-color:var(--ok)}
.qbox label.wrong{background:var(--bad-soft);border-color:var(--bad)}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);z-index:100}
.gate-box{max-width:380px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.gate-box .big{font-size:3rem}
.gate-box h3{margin:8px 0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
/* ===== الطابع الفخم الداكن (كحلي وذهبي) ===== */
html,body{background:#0a1120}
body{background:radial-gradient(1100px 600px at 105% -10%,rgba(217,180,108,.13),transparent 60%),radial-gradient(900px 520px at -15% 8%,rgba(58,96,190,.22),transparent 62%),radial-gradient(800px 600px at 50% 120%,rgba(30,60,130,.25),transparent 60%),#0a1120;background-attachment:fixed;-webkit-font-smoothing:antialiased}
header{padding:26px 16px 14px}
h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{-webkit-text-fill-color:var(--muted)}
.sub{font-size:.86rem;line-height:1.7}
.progress{margin-top:16px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);font-weight:600}
.bar{height:10px;background:rgba(255,255,255,.07)}
.bar>i{background:var(--gold);box-shadow:0 0 14px rgba(217,180,108,.55)}
nav{background:rgba(10,17,32,.72);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line)}
.tab{background:rgba(255,255,255,.04);color:var(--muted);transition:all .2s}
.tab:hover{color:var(--ink);border-color:rgba(217,180,108,.4)}
.tab[aria-selected=true]{background:var(--gold);color:#1b1407;border-color:transparent;font-weight:700;box-shadow:0 6px 18px rgba(217,180,108,.32)}
.card,.rv-card,.stage,.qbox,.lock-card,.ep,.progress{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card,.rv-card,.qbox,.lock-card,.ep{box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.card:hover,.ep:hover{border-color:rgba(217,180,108,.35)}
.card.open{border-color:rgba(217,180,108,.55);box-shadow:0 14px 40px rgba(0,0,0,.35),0 0 0 1px rgba(217,180,108,.18)}
.card.done{border-color:rgba(79,209,161,.45)}
.row{padding:14px}
.row .en{font-size:1.06rem;letter-spacing:.005em}
.row .pos{color:var(--accent);letter-spacing:.02em}
.plan h3,.unit-head h2{color:var(--accent);letter-spacing:.01em}
.plan .card{padding:18px}
.icon-btn{background:rgba(217,180,108,.1);border-color:rgba(217,180,108,.35);color:var(--accent);transition:all .2s}
.icon-btn:hover{background:var(--gold);color:#1b1407;box-shadow:0 4px 14px rgba(217,180,108,.4)}
.btn{background:rgba(255,255,255,.05);transition:all .2s}
.btn:hover{border-color:rgba(217,180,108,.45);background:rgba(255,255,255,.08)}
.btn.primary{background:var(--gold);border-color:transparent;color:#1b1407;font-weight:700;box-shadow:0 6px 18px rgba(217,180,108,.28)}
.btn.primary:hover{filter:brightness(1.07);box-shadow:0 8px 24px rgba(217,180,108,.4)}
.btn.rec{background:linear-gradient(135deg,#f2867a,#c4473b);border-color:transparent}
.btn.good{background:linear-gradient(135deg,#5fe0b0,#2a9f74);border-color:transparent;color:#06231a;font-weight:700}
.chip{background:rgba(255,255,255,.04);transition:all .2s}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(217,180,108,.1)}
.chip.lesson.full{border-color:var(--ok)}
.ex,.result,.stat{background:rgba(255,255,255,.035);border:1px solid var(--line)}
.stat b{color:var(--accent)}
.tip{border:1px solid rgba(240,195,107,.25)}
.ai{border:1px solid rgba(217,180,108,.25)}
.tools input,.tools select,textarea{background:rgba(255,255,255,.04);transition:border-color .2s,box-shadow .2s}
.tools input:focus,.tools select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,180,108,.15)}
select option{background:var(--solid);color:var(--ink)}
.banner{background:linear-gradient(135deg,rgba(217,180,108,.22),rgba(58,96,190,.25));border:1px solid rgba(217,180,108,.4);color:var(--ink);box-shadow:var(--shadow)}
.banner .btn{background:var(--gold);color:#1b1407;border-color:transparent}
.stage{background:linear-gradient(180deg,rgba(217,180,108,.08),rgba(255,255,255,.03));box-shadow:var(--shadow)}
.person .av{background:var(--solid)}
.person.talk .av{border-color:var(--accent);box-shadow:0 0 0 6px rgba(217,180,108,.2),0 0 24px rgba(217,180,108,.35)}
.ep .num{background:rgba(217,180,108,.12);color:var(--accent)}
.lines .ln{background:rgba(255,255,255,.035)}
.lines .ln.cur{background:var(--accent-soft)}
.tab .cnt{background:#f2867a}
.modal-bg{background:rgba(3,7,16,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal{background:var(--solid);border:1px solid rgba(217,180,108,.25);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.gate{background:radial-gradient(800px 500px at 100% 0%,rgba(217,180,108,.14),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(58,96,190,.25),transparent 60%),#0a1120}
.gate-box{background:rgba(255,255,255,.05);border:1px solid rgba(217,180,108,.25);border-radius:22px;padding:30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.gate-box h3{color:var(--accent)}
.toast{background:var(--gold);color:#1b1407;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}
::selection{background:rgba(217,180,108,.35)}

/* ===== v17: بلاطات الأقسام + زراير جديدة ===== */
.tabs{gap:8px;padding:12px}
.tab.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:82px;padding:10px 10px 9px;border-radius:16px;font-size:.78rem;font-weight:600;background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--muted);position:relative;box-shadow:none}
.tab.tile .ti{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:1.25rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);transition:all .25s}
.tab.tile:hover{color:var(--ink);border-color:rgba(217,180,108,.35)}
.tab.tile:hover .ti{transform:translateY(-2px)}
.tab.tile[aria-selected=true]{background:linear-gradient(180deg,rgba(217,180,108,.2),rgba(217,180,108,.03));border-color:rgba(217,180,108,.6);color:var(--accent);font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.tab.tile[aria-selected=true] .ti{background:var(--gold);border-color:transparent;box-shadow:0 6px 16px rgba(217,180,108,.45)}
.tab.tile[aria-selected=true]::after{content:"";position:absolute;bottom:-1px;left:28%;right:28%;height:3px;border-radius:3px 3px 0 0;background:var(--gold)}
.tab.tile .cnt{position:absolute;top:5px;inset-inline-start:6px;margin:0}
/* كروت الأقسام في الخطة */
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.sec{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic n" "t t" "bar bar";align-items:center;gap:8px 10px;text-align:start;padding:14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));color:var(--ink);font:inherit;cursor:pointer;transition:all .2s}
.sec:hover{border-color:rgba(217,180,108,.55);transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.35)}
.sec-ic{grid-area:ic;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.3rem;background:rgba(217,180,108,.12);border:1px solid rgba(217,180,108,.3)}
.sec-n{grid-area:n;justify-self:end;font-weight:700;font-size:1.15rem;color:var(--accent)}
.sec-n small{color:var(--muted);font-weight:500;font-size:.75rem}
.sec-t{grid-area:t;font-weight:600;font-size:.92rem}
.sec-bar{grid-area:bar;height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.sec-bar i{display:block;height:100%;background:var(--gold)}
/* الزراير */
.btn{border-radius:12px;padding:10px 15px;font-weight:600;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 8px rgba(0,0,0,.25);transition:transform .15s,border-color .2s,color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);border-color:rgba(217,180,108,.55);color:var(--accent);background:linear-gradient(180deg,rgba(217,180,108,.12),rgba(255,255,255,.02))}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#f4dc9e,#c99a4a);color:#1b1407;border:1px solid #f6e0a8;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 22px rgba(201,154,74,.35)}
.btn.primary:hover{color:#1b1407;filter:brightness(1.06);background:linear-gradient(180deg,#f7e3ad,#d2a556)}
.btn.rec:hover,.btn.good:hover{color:inherit}
.icon-btn{border-radius:14px;width:44px;height:44px}
.chip{border-radius:10px;padding:6px 12px}

/* ===================== المقارنة والتصحيح ===================== */
const CONTR={"i'll":"i will","we'll":"we will","you'll":"you will","it'll":"it will","they'll":"they will","he'll":"he will","i'm":"i am","im":"i am","you're":"you are","we're":"we are","they're":"they are","that's":"that is","thats":"that is","what's":"what is","whats":"what is","it's":"it is","its":"it is","who's":"who is","there's":"there is","here's":"here is","where's":"where is","let's":"let us","lets":"let us","i'd":"i would","we'd":"we would","you'd":"you would","can't":"can not","cant":"can not","cannot":"can not","don't":"do not","dont":"do not","doesn't":"does not","doesnt":"does not","didn't":"did not","didnt":"did not","isn't":"is not","isnt":"is not","aren't":"are not","wasn't":"was not","won't":"will not","wont":"will not","couldn't":"could not","shouldn't":"should not","wouldn't":"would not","haven't":"have not","hasn't":"has not","i've":"i have","ive":"i have","we've":"we have","you've":"you have",
 /* الكلام المتصل والاختصارات المنطوقة */
 "lemme":"let me","shoulda":"should have","coulda":"could have","woulda":"would have","musta":"must have","should've":"should have","could've":"could have","would've":"would have","must've":"must have","dontcha":"do not you","wouldja":"would you","wouldya":"would you","couldja":"could you","dja":"did you","gimme":"give me","gonna":"going to","wanna":"want to","gotta":"got to","hafta":"have to","hasta":"has to","oughta":"ought to","kinda":"kind of","sorta":"sort of","outta":"out of","lotta":"lot of","lotsa":"lots of","dunno":"do not know","whaddya":"what do you","watcha":"what are you","whatcha":"what are you","didja":"did you","dija":"did you","doncha":"do not you","gotcha":"got you","betcha":"bet you","cuz":"because","coz":"because","cause":"because","'cause":"because","y'know":"you know","ya":"you","yah":"you","u":"you","ur":"your","em":"them","'em":"them","tho":"though","thru":"through","til":"until","till":"until","ok":"okay","alright":"all right","mr":"mister","mrs":"missus","dr":"doctor","goin":"going","doin":"doing","nothin":"nothing","somethin":"something","an'":"and","'n'":"and","n'":"and","'n":"and"};
const NUMS={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","15":"fifteen","20":"twenty","25":"twenty five","30":"thirty","50":"fifty","60":"sixty","70":"seventy","80":"eighty","90":"ninety","100":"one hundred","1st":"first","2nd":"second","3rd":"third","5th":"fifth"};
const FILLERS=new Set(["uh","um","umm","er","erm","ah","hmm","mm","eh"]);
/* كلمات تتنطق بنفس الطريقة أو تُكتب بأشكال مختلفة في تحويل الصوت لكتابة */
const SAME=[["to","too","two","ta","a"],["for","four","fore","fer"],["and","n","an","in","&"],["you","ya","yeah"],["of","a","uv"],["the","da","thee"],["right","write","rite"],["there","their"],["here","hear"],["by","buy","bye"],["know","no"],["new","knew"],["week","weak"],["meet","meat"],["one","won"],["eight","ate"],["wait","weight"],["some","sum"],["through","threw"],["would","wood"],["our","hour","are"],["is","s","'s"],["will","ll"],["am","m"],["are","re"],["have","ve","of"],["okay","ok"],["percent","per","cent"],["minutes","minute"],["meeting","meetin"],["then","than"]];
/* بعض المجموعات للهدف المحدد فقط: مثلاً لو الهدف and نقبل in، لكن لو الهدف in لا نقبل and */
const SAME_MAP={};SAME.forEach(g=>{const k=g[0];SAME_MAP[k]=SAME_MAP[k]||new Set();g.slice(1).forEach(x=>SAME_MAP[k].add(x))});
function norm(s){
  s=(s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/&/g," and ").replace(/(\d)\s*%/g,"$1 percent").replace(/%/g," percent").replace(/[-–—_\/]/g," ").replace(/[^a-z0-9'\s]/g," ");
  let w=s.split(/\s+/).filter(Boolean).map(x=>x==="'n'"||x==="'n"||x==="n'"?"n":x.replace(/^'+|'+$/g,""));
  w=w.flatMap(x=>(CONTR[x]||NUMS[x]||x).split(" ")).filter(x=>x&&!FILLERS.has(x));
  // دمج الحروف المنفردة المتتالية (مثل u a t -> uat)
  const out=[];let run=[];
  const flush=()=>{if(run.length>=3)out.push(run.join(""));else out.push(...run);run=[]};
  for(const x of w){if(x.length===1&&x!=="a"&&x!=="i"||(x.length===1&&run.length)){run.push(x)}else{flush();out.push(x)}}
  flush();
  return out.filter(Boolean);
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2)return 9;
  let p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[b.length];
}
function stem(w){return w.replace(/(ing|ed|s)$/,"").replace(/e$/,"")}
/* 2 = مطابقة، 1 = قريبة (مقبولة)، 0 = غير مطابقة */
function eq(t,h){
  if(t===h)return 2;
  if(SAME_MAP[t]&&SAME_MAP[t].has(h))return 2;
  if(t.length>=4&&(t.replace(/s$/,"")===h.replace(/s$/,"")||t.replace(/es$/,"")===h.replace(/es$/,"")))return 2;
  if(t.length>=4&&stem(t)===stem(h))return 1;
  const L=Math.max(t.length,h.length),d=lev(t,h);
  if(L>=5&&d<=1)return 1;
  if(L>=8&&d<=2)return 1;
  return 0;
}
function compare(target,heard){
  const T=norm(target),H=norm(heard),n=T.length,m=H.length;
  const W={2:1,1:0.97};
  const dp=Array.from({length:n+2},()=>new Array(m+2).fill(0));
  const mv=Array.from({length:n+1},()=>new Array(m+1).fill(null));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--){
    let best=dp[i+1][j],how="skipT";
    if(dp[i][j+1]>best){best=dp[i][j+1];how="skipH"}
    const e=eq(T[i],H[j]);
    if(e&&W[e]+dp[i+1][j+1]>best){best=W[e]+dp[i+1][j+1];how=e===2?"ok":"near"}
    // كلمتان في الهدف = كلمة واحدة مسموعة (set up / setup)
    if(i+1<n&&T[i]+T[i+1]===H[j]&&2+dp[i+2][j+1]>best){best=2+dp[i+2][j+1];how="join2"}
    // كلمة في الهدف = كلمتان مسموعتان (setup / set up ، checkin)
    if(j+1<m){const e2=eq(T[i],H[j]+H[j+1]);if(e2&&W[e2]+dp[i+1][j+2]>best){best=W[e2]+dp[i+1][j+2];how=e2===2?"split2":"split2n"}}
    dp[i][j]=best;mv[i][j]=how;
  }
  const st=new Array(n).fill("miss");let i=0,j=0,used=0;
  while(i<n&&j<m){
    const h=mv[i][j];
    if(h==="ok"||h==="near"){st[i]=h;i++;j++;used++}
    else if(h==="join2"){st[i]=st[i+1]="ok";i+=2;j++;used++}
    else if(h==="split2"||h==="split2n"){st[i]=h==="split2"?"ok":"near";i++;j+=2;used+=2}
    else if(h==="skipT")i++;else j++;
  }
  const good=st.filter(x=>x==="ok").length+0.5*st.filter(x=>x==="near").length;
  const extra=Math.max(0,m-used);
  const score=n?Math.round(100*good/(n+Math.min(extra,n)*0.15)):0;
  const okIdx=new Set(st.map((x,k)=>x!=="miss"?k:-1).filter(k=>k>=0));
  return {T,st,okIdx,missed:T.filter((_,k)=>st[k]==="miss"),near:T.filter((_,k)=>st[k]==="near"),score:Math.min(100,score)};
}
function wordsHTML(r){return r.T.map((w,k)=>`<span class="w ${r.st[k]}">${esc(w)}</span>`).join(" ")}
function scoreMsg(s){
  if(s>=100)return["ممتاز! نطقك مفهوم تماماً 👏","ok"];
  if(s>=80)return["جيد جداً — راجع الكلمات الحمراء","ok"];
  if(s>=50)return["قريب — اسمع النطق مرة أخرى وكرر ببطء","warn"];
  return["حاول مرة أخرى بهدوء وببطء","bad"];
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let srBlocked=false;
function listen(onText,btn){
  if(!SR||srBlocked)return;
  let rec;try{rec=new SR()}catch(e){srBlocked=true;render();return}
  rec.lang="en-US";rec.interimResults=true;rec.maxAlternatives=1;
  btn.classList.add("rec");btn.textContent="⏺ أستمع… تكلّم الآن";
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;onText(t,e.results[e.results.length-1].isFinal)};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){srBlocked=true;toast("المايك المباشر غير مسموح هنا — استخدم مايك الكيبورد في المربع");render()}};
  rec.onend=()=>{btn.classList.remove("rec");btn.textContent="🎤 انطق الآن"};
  try{rec.start()}catch(e){srBlocked=true;render()}
}

function doneCount(prefix){return Object.keys(state.done).filter(k=>state.done[k]&&(!prefix||k.startsWith(prefix))).length}
function updateProgress(){
  const t=totalCount(),d=doneCount();
  $("#progTxt").textContent=`أتقنت ${d} من ${t}`;
  $("#progBar").style.width=(t?100*d/t:0)+"%";

const EVERY=10;

function markSeen(id){
  const it=itemById(id);
  if(it){state.seenData=state.seenData||{};state.seenData[id]={en:it.en,ar:it.ar,ex:it.ex,tip:it.tip}}
  if(!state.seen.includes(id)){state.seen.push(id);state.since=(state.since||0)+1;save();
    if(state.since===EVERY){toast("🔁 درست 10 جمل — حان وقت المراجعة")}}
}
function reviewDue(){return (state.since||0)>=EVERY}
function buildQueue(kind){
  const seen=state.seen.filter(id=>itemById(id));
  let q;
  if(kind==="all"){q=shuffle(seen.slice()).slice(0,EVERY)}
  else{
    const recent=seen.slice(-Math.max(EVERY,state.since||0)).slice(-EVERY);
    // + حتى 3 جمل أقدم: الأضعف أولاً (للتكرار المتباعد)
    const older=seen.slice(0,seen.length-recent.length)
      .sort((a,b)=>(state.best[a]||0)-(state.best[b]||0)+(Math.random()-.5)*20).slice(0,3);
    q=shuffle(recent.concat(older));
  }
  return q;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startReview(kind){
  const q=buildQueue(kind);
  if(!q.length){toast("ذاكر بعض الجمل أولاً");return}
  rv={queue:q,idx:0,shown:false,good:0,again:new Set(),total:q.length};
  if(kind!=="all"){state.since=0;state.rounds=(state.rounds||0)+1;save()}
  current="review";render();window.scrollTo(0,0);
}

const LESSON=25;
function curLevel(u){state.level=state.level||{};return Math.min(Math.max(state.level[u.id]||1,1),availLevels(u)||1)}
function renderUnit(u){
  const LV=curLevel(u),key=u.id+"-"+LV,items0=DATA[key];
  const lvChips=Array.from({length:MAXLEVEL},(_,k)=>{
    const L=k+1,n=u.levels[k]||0,dd=n?Object.keys(state.done).filter(id=>state.done[id]&&id.startsWith(u.id+"-")&&Math.floor(+id.split("-").pop()/PER)+1===L).length:0;
    return `<button class="chip lesson level${n&&dd===n?" full":""}" data-level="${L}" aria-pressed="${L===LV}" ${n?"":"disabled"}>المستوى ${L}<small>${n?levelName(L)+" · "+dd+"/"+n:"قريباً"}</small></button>`}).join("");
  const head=`<div class="unit-head"><h2>${u.title}</h2><span>${doneCount(u.id+"-")}/${u.levels.reduce((a,b)=>a+b,0)} · ${u.desc}</span></div>
   <div class="lessons levels">${lvChips}</div>`;
  if(!items0){
    loadLevel(u.id,LV).then(()=>{if(current===u.id)render()}).catch(()=>{const el=$("#loadmsg");if(el)el.innerHTML=`تعذّر تحميل المستوى. <button class="btn" data-retry="1">إعادة المحاولة</button>`});
    return head+`<div class="empty" id="loadmsg">جارٍ تحميل المستوى ${LV}…</div>`;
  }
  const nL=Math.ceil(items0.length/LESSON);
  state.lesson=state.lesson||{};
  const lk=u.id+":"+LV;
  let L=Math.min((state.lesson[lk]!=null?state.lesson[lk]:(LV===1?state.lesson[u.id]:0))||0,nL-1);
  let items=query?items0:items0.slice(L*LESSON,(L+1)*LESSON);
  if(filter==="todo")items=items.filter(x=>!state.done[x.id]);
  if(filter==="done")items=items.filter(x=>state.done[x.id]);
  if(query){const q=query.toLowerCase();items=items.filter(x=>(x.en+" "+x.ar+" "+x.ex).toLowerCase().includes(q))}
  const chips=Array.from({length:nL},(_,k)=>{
    const sl=items0.slice(k*LESSON,(k+1)*LESSON),dd=sl.filter(x=>state.done[x.id]).length;
    return `<button class="chip lesson${dd===sl.length?" full":""}" data-lesson="${k}" aria-pressed="${k===L&&!query}">درس ${k+1}<small>${dd}/${sl.length}</small></button>`}).join("");
  const nextLevel=LV<MAXLEVEL&&u.levels[LV]>0;
  return `<div class="tools"><input id="q" placeholder="ابحث في المستوى ${LV}…" value="${esc(query)}"><select id="flt">
   <option value="all"${filter==="all"?" selected":""}>الكل</option><option value="todo"${filter==="todo"?" selected":""}>لم أتقنها بعد</option><option value="done"${filter==="done"?" selected":""}>أتقنتها</option></select></div>
   ${head}
   <div class="lessons">${chips}</div>
   ${query?`<div class="hint">نتائج البحث في المستوى ${LV} (${items.length})</div>`:`<div class="hint">المستوى ${LV} (${levelName(LV)}) · الدرس ${L+1} من ${nL}</div>`}
   ${items.length?items.map(cardHTML).join(""):`<div class="empty">لا توجد عناصر هنا</div>`}
   ${!query&&L<nL-1?`<div class="btns" style="justify-content:center;margin-top:12px"><button class="btn primary" data-lesson="${L+1}">الدرس التالي ←</button></div>`:""}
   ${!query&&L===nL-1&&nextLevel?`<div class="btns" style="justify-content:center;margin-top:12px"><button class="btn primary" data-level="${LV+1}">المستوى التالي ←</button></div>`:""}`;
}

function voiceFor(side){

}
function playFrom(e,start){
  const token=++play.token;play.on=true;play.i=start;render();
  const step=()=>{
    if(token!==play.token)return;
    if(play.i>=e.lines.length){play.on=false;play.i=-1;render();const q=$("#qbox");q&&q.scrollIntoView({behavior:"smooth"});return}
    const ln=e.lines[play.i];
    try{
      const u=new SpeechSynthesisUtterance(ln[1]);u.lang=ln[0]==="A"?"en-US":"en-GB";
      const v=voiceFor(ln[0]);if(v)u.voice=v;u.rate=play.slow?0.65:0.95;u.pitch=ln[0]==="A"?1:0.85;
      u.onend=()=>{if(token!==play.token)return;setTimeout(()=>{if(token!==play.token)return;play.i++;render();step()},450)};
      u.onerror=u.onend;
      speechSynthesis.speak(u);
    }catch(err){play.on=false;render();toast("تعذّر تشغيل الصوت")}
  };
  try{speechSynthesis.cancel()}catch(_){}
  step();
}

   <div class="heard">ما سمعه الجهاز: <span class="en">${esc(heard)}</span></div>
   ${r.near.length?`<div class="hint">🟡 الكلمات الصفراء قريبة لكن غالباً فيها صوت مختلف (زي p/b أو th أو v/f). اسمعها ببطء 🐢 وكرّرها.</div>`:""}
   ${r.missed.length?`<div class="hint">جرّب: اسمع النطق البطيء 🐢 للكلمات الحمراء، ثم انطقها منفردة، ثم الجملة كاملة.</div>`:""}
   ${sampleFn?`<div class="btns" style="margin-top:8px"><button class="btn" data-ai="1">🧑‍🏫 اشرح لي الأخطاء وكيف أصحح النطق</button></div><div class="ai" style="display:none"></div>`:""}
  </div>`;
  const aiBtn=res.querySelector("[data-ai]");if(aiBtn)aiBtn._data={heard,missed:r.missed};
  const prev=state.best[x.id]||0;
  if(r.score>prev){state.best[x.id]=r.score;save()}
  if(r.score>=100&&!state.done[x.id]){state.done[x.id]=true;save();updateProgress();card.classList.add("done");const cb=card.querySelector("[data-done]");if(cb)cb.checked=true;toast("🎉 100% — تم تعليمها كمُتقنة")}
}
/* ===================== قفل الوصول (Firebase: حساب Google + جهاز مفعّل + محتوى مشفّر) ===================== */
let IS_OWNER=false, FB=null, ME=null, CKEY=null, MASTER_HEX="", appStarted=false;
const DEV_KEY="we-device-code";
function deviceCode(){
  try{let c=localStorage.getItem(DEV_KEY);
    if(!c){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=new Uint32Array(8);crypto.getRandomValues(r);c=[...r].map(x=>a[x%a.length]).join("");c=c.slice(0,4)+"-"+c.slice(4);localStorage.setItem(DEV_KEY,c)}
    return c}catch(e){return null}
}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))])}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function importKey(hex){
  if(!/^[0-9a-f]{64}$/i.test(hex||""))throw new Error("bad key");
  const raw=new Uint8Array(hex.match(/../g).map(h=>parseInt(h,16)));
  return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
}
async function fetchData(name,key){
  const r=await fetch("data/"+name+".enc",{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);
  const bytes=unb64((await r.text()).trim());
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes.slice(0,12)},key||CKEY,bytes.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function startApp(){if(appStarted)return;appStarted=true;$("#gate").style.display="none";$("#app").style.display="";render()}
function gateScreen(icon,title,msg,btnsHTML){
  $("#gate").style.display="";$("#app").style.display="none";appStarted=false;
  $("#gateIcon").textContent=icon;$("#gateTitle").textContent=title;$("#gateMsg").innerHTML=msg;$("#gateBtns").innerHTML=btnsHTML||"";
}
const RETRY='<button class="btn primary" data-gateretry="1">إعادة المحاولة</button>';
const OUT='<button class="btn" data-signout="1">تسجيل خروج</button>';
const row=h=>`<div class="btns" style="justify-content:center;margin-top:12px">${h}</div>`;
const isDenied=e=>e&&(e.code==="permission-denied"||/permission/i.test(e.code||""));
async function gate(){
  gateScreen("🔐","جارٍ التحقق…","لحظة واحدة","");
  for(let k=0;k<60&&!window.FBP;k++)await new Promise(r=>setTimeout(r,250));
  try{FB=await withTimeout(window.FBP,20000)}catch(e){gateScreen("⚠️","تعذّر التحميل","تأكد من الاتصال بالإنترنت وجرّب تاني.",row(RETRY));return}
  if(!FB){gateScreen("⚙️","الإعداد ناقص","ملف <span class=\"en\">config.js</span> لسه ما اتملاش ببيانات Firebase.","");return}
  ME=await FB.currentUser();
  if(!ME){gateScreen("🔒","الصفحة دي خاصة","سجّل دخولك بحساب Google عشان نتأكد إنك من المسموح لهم.",row('<button class="btn primary" data-signin="1">الدخول بحساب Google</button>'));return}
  const email=(ME.email||"").toLowerCase();
  // صاحب الصفحة: الوحيد المسموح له يقرأ owner/master (قواعد Firestore)
  try{
    const m=await withTimeout(FB.get("owner/master"),12000);
    IS_OWNER=true;
    if(!m.exists||!m.data.k){
      gateScreen("🔑","أول تشغيل: مفتاح المحتوى","الصق <b>مفتاح المحتوى</b> (64 حرف) الموجود في ملف التعليمات. هيتحفظ في حسابك على Firebase، ومش هتحتاجه تاني.",
        `<input id="mkey" class="en" placeholder="مفتاح المحتوى" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);margin-top:8px">`+row('<button class="btn primary" data-savekey="1">حفظ</button>'+OUT));return}
    MASTER_HEX=m.data.k;CKEY=await importKey(MASTER_HEX);startApp();return;
  }catch(e){
    if(!isDenied(e)){gateScreen("⚠️","تعذّر التحقق الآن","فيه مشكلة في الاتصال. جرّب تاني بعد شوية.",row(RETRY+OUT));return}
    IS_OWNER=false;
  }
  try{
    const p=await withTimeout(FB.get("people/"+email),12000);
    if(!p.exists){gateScreen("🔒","غير مسموح لك بفتح الصفحة دي",`الإيميل <span class="en">${esc(email)}</span> مش مضاف لقايمة المسموح لهم. اطلب من صاحب الصفحة يضيفه، أو سجّل خروج وادخل بإيميل تاني.`,row(OUT));return}
    const code=deviceCode();
    if(!code){gateScreen("🔒","المتصفح ده مش بيسمح بتفعيل الجهاز","افتح الصفحة من متصفح عادي (مش وضع التصفح الخفي) عشان الجهاز يتسجّل بصفة دائمة.",row(OUT));return}
    const devs=Array.isArray(p.data.devices)?p.data.devices:[];
    if(devs.includes(code)){
      const k=await withTimeout(FB.get("keys/"+code),12000);
      if(k.exists&&k.data.k){CKEY=await importKey(k.data.k);startApp();return}
    }
    gateScreen("📱","الجهاز ده محتاج تفعيل",`إيميلك مضاف ✓، لكن الجهاز ده لسه مش مفعّل.<br>ابعت <b>كود الجهاز</b> ده لصاحب الصفحة عشان يفعّله:<div style="font-size:1.6rem;font-weight:700;letter-spacing:3px;margin:14px 0" class="en" id="devcode">${code}</div>بعد ما يفعّله، الجهاز ده هيفضل مفعّل بصفة دائمة.`,
      row('<button class="btn" data-copycode="1">📋 نسخ الكود</button><button class="btn primary" data-gateretry="1">تحقق تاني</button>'+OUT));
  }catch(e){
    if(isDenied(e)){gateScreen("🔒","غير مسموح لك بفتح الصفحة دي","الحساب ده مش من المسموح لهم.",row(OUT));return}
    gateScreen("⚠️","تعذّر التحقق الآن","فيه مشكلة في الاتصال. جرّب تاني بعد شوية.",row(RETRY+OUT));
  }
}
document.addEventListener("DOMContentLoaded",gate);
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-gateretry],[data-copycode],[data-signin],[data-signout],[data-savekey]");if(!t)return;
  if(t.dataset.gateretry)gate();
  if(t.dataset.copycode){try{navigator.clipboard.writeText($("#devcode").textContent).then(()=>toast("اتنسخ الكود"),()=>toast("انسخه يدوياً"))}catch(_){toast("انسخه يدوياً")}}
  if(t.dataset.signin){try{await FB.signIn();gate()}catch(err){toast(err&&err.code==="auth/unauthorized-domain"?"الدومين ده مش مضاف في Firebase (Authorized domains)":"تعذّر تسجيل الدخول، جرّب تاني")}}
  if(t.dataset.signout){try{await FB.signOut()}catch(_){}IS_OWNER=false;CKEY=null;MASTER_HEX="";gate()}
  if(t.dataset.savekey){
    const hex=($("#mkey").value||"").trim().toLowerCase();
    let key;try{key=await importKey(hex);await fetchData("common-1",key)}catch(err){toast("المفتاح ده مش صحيح");return}
    try{await FB.set("owner/master",{k:hex});toast("✓ اتحفظ");gate()}catch(err){toast("تعذّر الحفظ")}
  }
});

/* ===================== لوحة إدارة الوصول (لصاحب الصفحة فقط) ===================== */
let ACC={loaded:false,loading:false,list:[],busy:false,err:""};
async function accLoad(){
  if(!FB||ACC.loading)return;ACC.loading=true;
  try{const docs=await withTimeout(FB.list("people"),12000);
    ACC.list=docs.map(d=>({email:d.id,name:d.data.name||"",devices:Array.isArray(d.data.devices)?d.data.devices:[],labels:d.data.labels||{}})).sort((a,b)=>a.email.localeCompare(b.email));
    ACC.loaded=true;ACC.err=""}
  catch(e){ACC.err="تعذّر تحميل القايمة. جرّب تاني."}
  ACC.loading=false;if(current==="access")render();
}
const personDoc=p=>({name:p.name,devices:p.devices,labels:p.labels});
async function accRun(fn){
  ACC.busy=true;render();
  try{await fn();toast("✓ اتحفظ")}catch(e){toast("تعذّر الحفظ، جرّب تاني")}
  ACC.busy=false;await accLoad();
}
function renderAccess(){
  if(!IS_OWNER)return `<div class="empty">الصفحة دي لصاحب المنهج بس.</div>`;
  if(!ACC.loaded){if(!ACC.loading)accLoad();return `<div class="empty">${ACC.err||"جارٍ تحميل قايمة المسموح لهم…"} ${ACC.err?'<button class="btn" data-accreload="1">إعادة المحاولة</button>':""}</div>`}
  const people=ACC.list.map((p,pi)=>`<div class="card" style="padding:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>${esc(p.name||"بدون اسم")}</b><div class="en" style="font-size:.85rem;color:var(--muted)">${esc(p.email)}</div></div>
    <button class="btn" data-accdelp="${pi}" ${ACC.busy?"disabled":""}>🗑️ حذف</button></div>
    <div class="section-lbl">الأجهزة المفعّلة (${p.devices.length})</div>
    ${p.devices.length?p.devices.map((c,di)=>`<div class="req"><span class="en">${esc(c)}</span><span>${esc(p.labels[c]||"")} <button class="chip" data-accdeld="${pi}:${di}" ${ACC.busy?"disabled":""}>إلغاء</button></span></div>`).join(""):`<div class="hint">لسه مفيش أجهزة. لما يفتح الصفحة ويسجّل دخول هيظهر له كود، يبعته لك وتضيفه هنا.</div>`}
    <div class="tools" style="margin-top:8px"><input id="dc${pi}" class="en" placeholder="ABCD-EFGH" maxlength="9" style="text-transform:uppercase"><input id="dl${pi}" placeholder="اسم الجهاز (اختياري)"></div>
    <button class="btn primary" data-accaddd="${pi}" ${ACC.busy?"disabled":""}>➕ تفعيل الجهاز</button>
   </div>`).join("");
  return `<div class="unit-head"><h2>🔐 إدارة الوصول</h2><span>إنت بس اللي شايف الصفحة دي</span></div>
   <div class="card" style="padding:12px">
    <p style="margin-top:0">الشخص يقدر يفتح المنهج لو دخل بـ<b>حساب Google</b> إيميله مضاف هنا، <b>والجهاز</b> اللي فاتح منه مفعّل. أي جهاز جديد هيظهر له كود يبعته لك.</p>
    <div class="tools"><input id="newEmail" class="en" type="email" placeholder="name@gmail.com"><input id="newName" placeholder="الاسم"></div>
    <button class="btn primary" data-accaddp="1" ${ACC.busy?"disabled":""}>➕ إضافة إيميل</button>
   </div>
   <div class="section-lbl">المسموح لهم (${ACC.list.length})</div>
   ${people||`<div class="empty">القايمة فاضية — إنت بس اللي تقدر تفتح المنهج.</div>`}
   <div class="btns" style="justify-content:center;margin-top:16px">${OUT}</div>`;
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-accaddp],[data-accdelp],[data-accaddd],[data-accdeld],[data-accreload]");if(!t||!IS_OWNER||ACC.busy)return;
  if(t.dataset.accreload){ACC.err="";accLoad();return}
  if(t.dataset.accaddp){
    const em=($("#newEmail").value||"").trim().toLowerCase(),nm=($("#newName").value||"").trim();
    if(!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(em)){toast("اكتب إيميل صحيح");return}
    if(ACC.list.some(p=>p.email===em)){toast("الإيميل ده مضاف قبل كده");return}
    await accRun(()=>FB.set("people/"+em,{name:nm,devices:[],labels:{}}));return}
  if(t.dataset.accdelp!=null){const p=ACC.list[+t.dataset.accdelp];
    showModal(`<h3>حذف ${esc(p.name||p.email)}؟</h3><p>هيتقفل المنهج عنه على كل أجهزته.</p><div class="btns" style="margin-top:10px"><button class="btn rec" data-accdelok="${t.dataset.accdelp}">حذف</button><button class="btn" data-modalclose="1">إلغاء</button></div>`);return}
  if(t.dataset.accaddd!=null){const pi=+t.dataset.accaddd,p=ACC.list[pi];
    let c=($("#dc"+pi).value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(c.length!==8){toast("الكود 8 حروف/أرقام زي ABCD-EFGH");return}
    c=c.slice(0,4)+"-"+c.slice(4);
    if(p.devices.includes(c)){toast("الجهاز ده مفعّل بالفعل");return}
    const lbl=($("#dl"+pi).value||"").trim();
    await accRun(async()=>{await FB.set("keys/"+c,{k:MASTER_HEX});p.devices=p.devices.concat(c);if(lbl)p.labels={...p.labels,[c]:lbl};await FB.set("people/"+p.email,personDoc(p))});return}
  if(t.dataset.accdeld){const [pi,di]=t.dataset.accdeld.split(":").map(Number),p=ACC.list[pi],c=p.devices[di];
    await accRun(async()=>{p.devices=p.devices.filter(x=>x!==c);const l={...p.labels};delete l[c];p.labels=l;await FB.set("people/"+p.email,personDoc(p));await FB.del("keys/"+c)});return}
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-accdelok]");if(!t||!IS_OWNER)return;
  hideModal();const p=ACC.list[+t.dataset.accdelok];
  await accRun(async()=>{await FB.del("people/"+p.email);for(const c of p.devices)await FB.del("keys/"+c)});
});
</script>
